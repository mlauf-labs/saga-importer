# --- BEGIN saga-importer managed block ---
# This block is written by install-debian.sh. Do not edit manually.
[@SMB_SHARE_NAME@]
   comment = Saga Importer inbox
   path = @INBOX_DIR@
   browseable = yes
   read only = no
   create mask = 0660
   directory mask = 0770
   # force user/group so the daemon always owns new files and can delete them
   force user = @SERVICE_USER@
   force group = @SERVICE_USER@
@SMB_GUEST_LINE@
# --- END saga-importer managed block ---
